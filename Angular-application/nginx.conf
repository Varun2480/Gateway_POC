# The events section is required for Nginx to function correctly
events {
    worker_connections 1024;  # You can adjust the number of worker connections if needed
}

http {
    # Include standard Nginx configurations
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log formats
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    # Server block for handling requests
    server {
        listen 80;

        # Serve Angular app
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # Proxy API requests to the backend
        location /restaurants/ {
            proxy_pass {{API_URL}}/restaurants/;  # This will be replaced dynamically by the entrypoint script
            # proxy_pass http://localhost:30492;  # This will be replaced dynamically by the entrypoint script
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
