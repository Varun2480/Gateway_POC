apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ingress-nginx-internal-event-writer-binding
  namespace: ingress-nginx # Important: in the ingress-nginx namespace
subjects:
- kind: ServiceAccount
  name: default
  namespace: ingress-nginx
roleRef:
  kind: Role
  name: ingress-nginx-internal-event-writer
  apiGroup: rbac.authorization.k8s.io